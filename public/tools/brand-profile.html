<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brand Profile &amp; Data Manager - Shaynly</title>
  <meta name="description" content="Set up your central business identity and branding profile. Pre-fills invoices, brand sheets, schema generators, and business card tools offline.">
  <link rel="canonical" href="https://shaynly.com/tools/brand-profile.html">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Shaynly">
  <meta property="og:url" content="https://shaynly.com/tools/brand-profile.html">
  <meta property="og:title" content="Brand Profile &amp; Data Manager - Shaynly">
  <meta property="og:description" content="Set up your central business identity and branding profile offline.">
  <meta property="og:image" content="https://shaynly.com/assets/images/shaynly-og.png">

  <link rel="stylesheet" href="./core/shaynly.css">
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2218316924082551" crossorigin="anonymous"></script>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SW10LSENP0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SW10LSENP0', { link_ad_clicks: true, send_page_view: true });
  </script>
</head>
<body>
  <script src="./core/shaynly.js"></script>
  <script>
Shaynly.page('Brand Profile',`<p class="muted" style="margin-bottom:14px">Saved on this device only. The Schema Generator, robots.txt tool and others use it to pre-fill.</p>${[['name','Business name'],['website','Website (https://...)'],['email','Email'],['phone','Phone'],['city','City'],['sameAs','Social profile links (one per line)']].map(([k,l])=>`<div class="f"><label for="${k}">${l}</label>${k==='sameAs'?'<textarea rows=3':'<input'} id="${k}"${k==='sameAs'?'></textarea>':'>'}</div>`).join('')}<div class="row"><div class="f"><label for="color">Brand colour</label><input type="color" id="color" value="#1f6f6b"></div><div class="f"><label for="logo">Logo</label><input type="file" id="logo" accept="image/*"></div></div>`,'<div id="pv"></div><div class="row" style="margin-top:16px"><button class="btn alt" id="ex">Export backup</button><label class="btn alt" for="im" style="cursor:pointer">Restore backup</label><input id="im" type="file" accept=".json" hidden></div><p class="muted" style="margin-top:10px">Backup saves every tool setting on this device to one JSON file.</p>');
const s=Shaynly.store('brand'),b=s.get({}),$=i=>document.getElementById(i);
['name','website','email','phone','city','sameAs','color'].forEach(k=>{if(b[k])$(k).value=b[k];$(k).oninput=()=>{b[k]=$(k).value;s.set(b);pv()}});
$('logo').onchange=e=>{const r=new FileReader();r.onload=()=>{b.logo=r.result;s.set(b);pv()};r.readAsDataURL(e.target.files[0])};
function pv(){$('pv').innerHTML=`<div style="border-left:6px solid ${b.color||'#1f6f6b'};padding:14px 18px;background:var(--paper);border-radius:8px">${b.logo?`<img src="${b.logo}" alt="" style="max-height:60px;display:block;margin-bottom:10px">`:''}<h2>${(b.name||'Your business name').replace(/</g,'&lt;')}</h2><p class="muted">${[b.website,b.email,b.phone,b.city].filter(Boolean).join(' | ').replace(/</g,'&lt;')}</p></div>`}pv();
$('ex').onclick=()=>{const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('shaynly:'))o[k]=localStorage.getItem(k)}Shaynly.save(new Blob([JSON.stringify(o)],{type:'application/json'}),'shaynly-backup.json')};
$('im').onchange=e=>{const r=new FileReader();r.onload=()=>{try{Object.entries(JSON.parse(r.result)).forEach(([k,v])=>k.startsWith('shaynly:')&&localStorage.setItem(k,v));Shaynly.toast('Backup restored');setTimeout(()=>location.reload(),600)}catch{Shaynly.toast('That file is not a Shaynly backup')}};r.readAsText(e.target.files[0])};
  </script>
</body>
</html>
