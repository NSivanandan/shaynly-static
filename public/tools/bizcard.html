<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tool</title><link rel="stylesheet" href="../core/shaynly.css"></head><body><script src="../core/vendor/qrcode.js"></script><script src="../core/vendor/jspdf.min.js"></script><script src="../core/shaynly.js"></script><script>const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const SZ={'90x55':[90,55],'89x51':[88.9,50.8],'85x55':[85,55]},B=Shaynly.brand();
const inp=(k,l,v='')=>`<div class="f"><label for="${k}">${l}</label><input id="${k}" value="${esc(v)}"></div>`;
Shaynly.page('Business Card Designer',`${inp('nm','Name','Your Name')}${inp('tt','Job title','Founder')}${inp('cm','Company',B.name||'')}${inp('ph','Phone',B.phone||'')}${inp('em','Email',B.email||'')}${inp('wb','Website',(B.website||'').replace(/^https?:\/\//,''))}<div class="row"><div class="f"><label for="co">Colour</label><input type="color" id="co" value="${B.color||'#1f6f6b'}"></div><div class="f"><label for="tp">Layout</label><select id="tp"><option value="solid">Solid colour</option><option value="light">White with accent</option><option value="split">Split</option></select></div></div><div class="row"><div class="f"><label for="sz">Card size (mm)</label><select id="sz"><option value="90x55">90 × 55 (India, Europe)</option><option value="89x51">3.5 × 2 in (US)</option><option value="85x55">85 × 55</option></select></div><div class="f"><label for="bl">Print bleed</label><select id="bl"><option value="3">3 mm (recommended)</option><option value="0">None</option></select></div></div><p class="muted">Logo comes from Brand Profile. The back carries a QR that saves your contact (vCard).</p>`,'<canvas id="fr" style="width:100%;border:1px solid var(--line);border-radius:6px"></canvas><canvas id="bk" style="width:100%;border:1px solid var(--line);border-radius:6px;margin-top:10px"></canvas><div class="row" style="margin-top:14px"><button class="btn gold" id="pdf">Print-ready PDF</button><button class="btn alt" id="png">PNG (front and back)</button></div><p class="muted" style="margin-top:8px">300 dpi. Ask your printer whether they need 3 mm bleed; most do.</p>');
let logo=null;if(B.logo){logo=new Image();logo.onload=draw;logo.src=B.logo}
const pm=300/25.4;
function make(side){const bl=+$('bl').value,[mw,mh]=SZ[$('sz').value],W=Math.round((mw+2*bl)*pm),H=Math.round((mh+2*bl)*pm),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),m=(bl+5)*pm,col=$('co').value,t=$('tp').value,f=(w,s,fam)=>`${w} ${s*pm}px ${fam||'system-ui,Segoe UI,Arial,sans-serif'}`;
 const lg=(bx,by,mh2,al)=>{if(!logo||!logo.width)return false;const h=mh2*pm,w=h*logo.width/logo.height;x.drawImage(logo,al==='r'?bx-w:bx,by,w,h);return true};
 if(side==='front'){x.fillStyle=t==='light'?'#fff':col;x.fillRect(0,0,W,H);if(t==='split'){x.fillStyle='#fff';x.fillRect(0,H*.56,W,H)}if(t==='light'){x.fillStyle=col;x.fillRect(0,0,(bl+3)*pm,H)}
  const top=t==='solid'?'#fff':t==='light'?'#111':'#fff',bot=t==='solid'?'#fff':'#222';lg(W-m,m,12,'r');
  x.fillStyle=top;x.font=f(600,6.4,'Georgia,serif');x.fillText($('nm').value,m,H*(t==='split'?.3:.36));x.font=f(400,3.4);x.globalAlpha=.85;x.fillText($('tt').value,m,H*(t==='split'?.3:.36)+4.6*pm);x.globalAlpha=1;
  x.fillStyle=bot;x.font=f(600,3.4);x.fillText($('cm').value,m,H*.66+(t==='split'?0:0));x.font=f(400,3.1);[$('ph').value,$('em').value,$('wb').value].filter(Boolean).forEach((l,i)=>x.fillText(l,m,H*.66+(i+1)*4.4*pm))}
 else{x.fillStyle=col;x.fillRect(0,0,W,H);const q=qrcode(0,'M');q.addData(`BEGIN:VCARD\nVERSION:3.0\nFN:${$('nm').value}\nORG:${$('cm').value}\nTITLE:${$('tt').value}\nTEL:${$('ph').value}\nEMAIL:${$('em').value}\nURL:${$('wb').value}\nEND:VCARD`);q.make();const n=q.getModuleCount(),qs=22*pm,u=qs/(n+2),qx=W/2-qs/2,qy=H/2-qs/2-3*pm;x.fillStyle='#fff';x.fillRect(qx,qy,qs,qs);x.fillStyle='#111';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(qx+(k+1)*u,qy+(r+1)*u,u+.5,u+.5);
  x.fillStyle='#fff';x.font=f(600,3.4);x.textAlign='center';x.fillText($('cm').value||$('nm').value,W/2,qy+qs+6*pm);x.textAlign='left'}
 return c}
function draw(){['fr','bk'].forEach((id,i)=>{const c=make(i?'back':'front'),t=$(id);t.width=c.width;t.height=c.height;t.getContext('2d').drawImage(c,0,0)})}
document.querySelector('.grid').oninput=draw;
$('png').onclick=()=>{$('fr').toBlob(b=>Shaynly.save(b,'card-front.png'));$('bk').toBlob(b=>setTimeout(()=>Shaynly.save(b,'card-back.png'),300))};
$('pdf').onclick=()=>{const bl=+$('bl').value,[mw,mh]=SZ[$('sz').value],w=mw+2*bl,h=mh+2*bl,o=w>h?'l':'p',p=new window.jspdf.jsPDF({unit:'mm',format:[w,h],orientation:o});p.addImage($('fr').toDataURL('image/png'),'PNG',0,0,w,h);p.addPage([w,h],o);p.addImage($('bk').toDataURL('image/png'),'PNG',0,0,w,h);p.save('business-card.pdf')};draw();
</script></body></html>
