<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HTML Email Signature Designer - Shaynly</title>
  <meta name="description" content="Design professional HTML email signatures for Gmail, Apple Mail, and Outlook. Live visual preview with one-click rich text copying.">
  <link rel="canonical" href="https://shaynly.com/tools/signature.html">
    <!-- Site Icons & Favicon (SEO / Google Search / Apple Touch) -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Shaynly">
  <meta name="application-name" content="Shaynly">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Shaynly">
  <meta property="og:url" content="https://shaynly.com/tools/signature.html">
  <meta property="og:title" content="HTML Email Signature Designer - Shaynly">
  <meta property="og:description" content="Design professional HTML email signatures for Gmail, Apple Mail, and Outlook.">
  <meta property="og:image" content="https://shaynly.com/assets/images/shaynly-og.png">

  <link rel="stylesheet" href="./core/shaynly.css">
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2218316924082551" crossorigin="anonymous"></script>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SW10LSENP0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SW10LSENP0', { link_ad_clicks: true, send_page_view: true });
  </script>
</head>
<body>
  <script src="./core/shaynly.js"></script>
  <script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const B=Shaynly.brand(),inp=(k,l,v='',p='')=>`<div class="f"><label for="${k}">${l}</label><input id="${k}" value="${esc(v)}" placeholder="${p}"></div>`;
Shaynly.page('Email Signature Designer',`${inp('nm','Name','Your Name')}${inp('tt','Title','Founder')}${inp('cm','Company',B.name||'')}${inp('ph','Phone',B.phone||'')}${inp('em','Email',B.email||'')}${inp('wb','Website',B.website||'')}${inp('lg','Logo image address (https://...)','','Must be a public https address')}<div class="f"><label for="so">Social links (one per line: Label | address)</label><textarea id="so" rows="3">${(B.sameAs||'').split('\n').filter(Boolean).map(u=>(u.match(/linkedin|instagram|twitter|x\.com|facebook|youtube/i)?.[0]||'Profile')+' | '+u).join('\n')}</textarea></div><div class="row"><div class="f"><label for="co">Accent</label><input type="color" id="co" value="${B.color||'#1f6f6b'}"></div><div class="f"><label for="ly">Layout</label><select id="ly"><option value="h">Logo beside details</option><option value="v">Stacked</option></select></div></div>${inp('ds','Short disclaimer (optional)')}`,'<div id="pv" style="background:#fff;color:#222;padding:16px;border:1px solid var(--line);border-radius:8px;overflow:auto"></div><div class="row" style="margin-top:14px"><button class="btn gold" id="cp">Copy signature</button><button class="btn alt" id="ch">Copy HTML code</button></div><p class="muted" style="margin-top:10px">Gmail and Outlook strip embedded images, so the logo must be a public https address (your website or an image host). Paste into Gmail via Settings &rarr; Signature. In Outlook, use the Signatures editor.</p>');
let h='';function build(){const v=i=>esc($(i).value.trim()),c=$('co').value,F="font-family:Arial,Helvetica,sans-serif;",a=u=>`<a href="${u}" style="color:${c};text-decoration:none">`;
 const soc=$('so').value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(x=>/^https?:/.test(x[1]||'')).map(x=>`${a(esc(x[1]))}${esc(x[0])}</a>`).join(' &nbsp;|&nbsp; ');
 const web=$('wb').value.trim(),det=`<td style="${F}font-size:13px;line-height:1.5;color:#333;padding-${$('ly').value==='h'?'left':'top'}:14px;${$('ly').value==='h'?`border-left:3px solid ${c};`:''}"><div style="font-size:16px;font-weight:bold;color:#111">${v('nm')}</div><div style="color:#555">${v('tt')}${v('tt')&&v('cm')?' | ':''}${v('cm')}</div><div style="margin-top:6px">${v('ph')?`<span style="color:#555">T</span> ${a('tel:'+v('ph').replace(/[^\d+]/g,''))}${v('ph')}</a><br>`:''}${v('em')?`<span style="color:#555">E</span> ${a('mailto:'+v('em'))}${v('em')}</a><br>`:''}${web?`<span style="color:#555">W</span> ${a(esc(/^https?:/.test(web)?web:'https://'+web))}${esc(web.replace(/^https?:\/\//,''))}</a>`:''}</div>${soc?`<div style="margin-top:6px;font-size:12px">${soc}</div>`:''}${$('ds').value?`<div style="margin-top:8px;font-size:11px;color:#888;max-width:420px">${v('ds')}</div>`:''}</td>`;
 const lg=/^https:\/\//.test($('lg').value.trim())?`<td style="vertical-align:top;${$('ly').value==='h'?'padding-right:14px':'padding-bottom:10px;display:block'}"><img src="${esc($('lg').value.trim())}" alt="${v('cm')}" width="110" style="display:block;border:0;max-width:110px"></td>`:'';
 h=$('ly').value==='h'?`<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse"><tr>${lg}${det}</tr></table>`:`<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse">${lg?`<tr>${lg}</tr>`:''}<tr>${det}</tr></table>`;$('pv').innerHTML=h}
document.querySelector('.grid').oninput=build;
$('cp').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([h],{type:'text/html'}),'text/plain':new Blob([$('pv').innerText],{type:'text/plain'})})]);Shaynly.toast('Signature copied. Paste it into your email settings.')}catch{Shaynly.copy(h)}};$('ch').onclick=()=>Shaynly.copy(h);build();
  </script>
</body>
</html>
