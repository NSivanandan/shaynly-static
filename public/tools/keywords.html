  <meta name="description" content="Cluster thousands of SEO keywords by semantic relevance and classify search intent (Transactional, Commercial, Informational). Export CSV directly.">
  <link rel="canonical" href="https://shaynly.com/tools/keywords.html">
    <!-- Site Icons & Favicon (SEO / Google Search / Apple Touch) -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <meta property="og:title" content="SEO Keyword Clusterer &amp; Intent Classifier - Shaynly">
  <meta property="og:description" content="Cluster thousands of SEO keywords by semantic relevance and classify search intent.">
  <meta property="og:image" content="https://shaynly.com/assets/images/shaynly-og.png">

  <link rel="stylesheet" href="./core/shaynly.css">
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Google AdSense -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SW10LSENP0', { link_ad_clicks: true, send_page_view: true });
  </script>
</head>
<body>
  <script src="./core/shaynly.js"></script>
  <script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const SW=new Set('a an the for in to of and or with on at near me my your best top how what why is are can do does vs'.split(' '));
Shaynly.page('Keyword Clusterer',`<div class="f"><label for="k">Paste keywords (one per line)</label><textarea id="k" rows="14" placeholder="dentist in bangalore\nbest dentist near me\nteeth whitening cost\n..."></textarea></div><div class="f"><label for="mn">Smallest cluster to show: <span id="mv">2</span></label><input type="range" id="mn" min="1" max="6" value="2"></div><button class="btn gold" id="go">Cluster keywords</button><p class="muted" style="margin-top:10px">Groups by the most shared meaningful word and labels search intent from wording. It is a fast first pass, so review the groups before building pages.</p>`,'<div id="r"><p class="muted">Paste a list and press Cluster keywords.</p></div><button class="btn alt" id="csv" style="margin-top:12px;display:none">Export CSV</button>');
const IN=[['Transactional',/\b(buy|price|prices|cost|cheap|hire|quote|book|order|near me|coupon|discount|pricing)\b/],['Commercial',/\b(best|top|vs|versus|review|reviews|compare|comparison|alternative|alternatives)\b/],['Informational',/\b(how|what|why|when|guide|tips|ideas|examples|meaning|tutorial|learn)\b/]];
const stem=w=>w.length>4?w.replace(/(ing|es|s)$/,''):w,intent=k=>(IN.find(([,r])=>r.test(k))||['Navigational or general'])[0];let rows=[];
function run(){const ks=[...new Set($('k').value.split('\n').map(x=>x.trim().toLowerCase()).filter(Boolean))],tk=ks.map(k=>[...new Set(k.split(/[^a-z0-9]+/).filter(w=>w&&!SW.has(w)).map(stem))]),df={};tk.forEach(t=>t.forEach(w=>df[w]=(df[w]||0)+1));
 const cl={};ks.forEach((k,i)=>{const h=tk[i].sort((a,b)=>df[b]-df[a]||b.length-a.length)[0]||'(other)';(cl[h]=cl[h]||[]).push(k)});const mn=+$('mn').value;
 rows=Object.entries(cl).sort((a,b)=>b[1].length-a[1].length).filter(([,v])=>v.length>=mn).map(([h,v])=>{const ic={};v.forEach(k=>ic[intent(k)]=(ic[intent(k)]||0)+1);return{h,v,i:Object.entries(ic).sort((a,b)=>b[1]-a[1])[0][0]}});
 const shown=rows.reduce((a,r)=>a+r.v.length,0);$('r').innerHTML=ks.length?`<div class="muted">${ks.length} unique keywords, ${rows.length} clusters, ${ks.length-shown} below the size cutoff.</div>`+rows.map(r=>`<div class="chk"><span><b>${esc(r.h)}</b> <span class="muted">${r.v.length} keywords | ${esc(r.i)}</span><small>${r.v.map(esc).join(', ')}</small></span></div>`).join('')+(rows.length?'<p class="muted" style="margin-top:10px">Tip: one page per cluster, with the clearest keyword in the title and the rest as subheadings.</p>':''):'<p class="err">Paste at least one keyword.</p>';$('csv').style.display=rows.length?'inline-flex':'none'}
$('go').onclick=run;$('mn').oninput=()=>{$('mv').textContent=$('mn').value;if($('r').textContent.includes('clusters'))run()};
$('csv').onclick=()=>Shaynly.save(new Blob(['Cluster,Intent,Keyword\n'+rows.flatMap(r=>r.v.map(k=>`"${r.h}","${r.i}","${k}"`)).join('\n')],{type:'text/csv'}),'keyword-clusters.csv');
  </script>
</body>
</html>
