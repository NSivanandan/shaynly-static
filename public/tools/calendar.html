<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Marketing Content Calendar - Shaynly</title>
  <meta name="description" content="Visual multi-channel marketing content calendar with status tracking (Idea, Draft, Scheduled, Published), offline storage, and CSV export.">
  <link rel="canonical" href="https://shaynly.com/tools/calendar.html">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Shaynly">
  <meta property="og:url" content="https://shaynly.com/tools/calendar.html">
  <meta property="og:title" content="Marketing Content Calendar - Shaynly">
  <meta property="og:description" content="Visual multi-channel marketing content calendar with status tracking and CSV export.">
  <meta property="og:image" content="https://shaynly.com/assets/images/shaynly-og.png">

  <link rel="stylesheet" href="./core/shaynly.css">
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2218316924082551" crossorigin="anonymous"></script>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SW10LSENP0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SW10LSENP0', { link_ad_clicks: true, send_page_view: true });
  </script>
</head>
<body>
  <script src="./core/shaynly.js"></script>
  <script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const PL=['Instagram','LinkedIn','X','Facebook','YouTube','Blog','Email'],ST=['Idea','Drafted','Scheduled','Published'],SC=Shaynly.store('calendar');let P=SC.get([]),cur=new Date();cur.setDate(1);let ed=null;
Shaynly.page('Content Calendar',`<div class="f"><label for="d">Date</label><input type="date" id="d"></div><div class="f"><label for="t">Post idea or title</label><input id="t"></div><div class="row"><div class="f"><label for="p">Channel</label><select id="p">${PL.map(x=>`<option>${x}</option>`)}</select></div><div class="f"><label for="s">Status</label><select id="s">${ST.map(x=>`<option>${x}</option>`)}</select></div></div><div class="f"><label for="n">Notes</label><textarea id="n" rows="2"></textarea></div><div class="row"><button class="btn gold" id="sv">Add post</button><button class="btn alt" id="dl" hidden>Delete</button></div><div class="row" style="margin-top:12px"><button class="btn alt" id="csv">Export CSV</button></div><div id="ins" class="muted" style="margin-top:14px"></div>`,'<div class="row" style="align-items:center;margin-bottom:10px"><button class="btn alt" id="pv" style="flex:0">&lsaquo;</button><b id="mt" style="flex:1;text-align:center"></b><button class="btn alt" id="nx" style="flex:0">&rsaquo;</button></div><div id="g" style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px"></div><style>.cell{min-height:78px;border:1px solid var(--line);border-radius:6px;padding:3px;font-size:.72rem;cursor:pointer}.cell b{color:var(--ink2)}.chip{display:block;margin-top:2px;padding:1px 4px;border-radius:4px;background:var(--paper);border-left:3px solid var(--brass);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.chip.Published{border-color:var(--teal)}.chip.Idea{border-color:var(--line)}</style>');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),save=()=>SC.set(P);
function draw(){$('mt').textContent=cur.toLocaleString('en',{month:'long',year:'numeric'});const y=cur.getFullYear(),m=cur.getMonth(),lead=(cur.getDay()+6)%7,n=new Date(y,m+1,0).getDate();let h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<b class="muted" style="text-align:center;font-size:.75rem">${x}</b>`).join('');for(let i=0;i<lead;i++)h+='<div></div>';let empty=0;const mp=P.filter(x=>x.d.startsWith(iso(cur).slice(0,7)));
 for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d)),ps=P.filter(x=>x.d===k);if(!ps.length)empty++;h+=`<div class="cell" data-d="${k}"><b>${d}</b>${ps.map(x=>`<span class="chip ${x.s}" data-id="${x.id}" title="${esc(x.p+': '+x.t)}">${esc(x.p.slice(0,2))}: ${esc(x.t)}</span>`).join('')}</div>`}
 $('g').innerHTML=h;const c=(a,k)=>a.reduce((o,x)=>(o[x[k]]=(o[x[k]]||0)+1,o),{});
 $('ins').innerHTML=`This month: ${mp.length} posts. ${Object.entries(c(mp,'s')).map(([k,v])=>`${k} ${v}`).join(', ')||'none yet'}.<br>${Object.entries(c(mp,'p')).map(([k,v])=>`${k} ${v}`).join(', ')}<br>${empty} of ${n} days have nothing planned.`}
$('g').onclick=e=>{const c=e.target.closest('.chip'),cell=e.target.closest('.cell');if(c){const x=P.find(p=>p.id==c.dataset.id);ed=x.id;['d','t','p','s','n'].forEach(k=>$(k).value=x[k]||'');$('sv').textContent='Save changes';$('dl').hidden=false}else if(cell){ed=null;$('d').value=cell.dataset.d;$('sv').textContent='Add post';$('dl').hidden=true;$('t').focus()}};
$('sv').onclick=()=>{if(!$('d').value||!$('t').value.trim()){Shaynly.toast('Enter a date and a title');return}const o={d:$('d').value,t:$('t').value.trim(),p:$('p').value,s:$('s').value,n:$('n').value};if(ed)Object.assign(P.find(x=>x.id===ed),o);else P.push({id:Date.now(),...o});save();ed=null;$('t').value=$('n').value='';$('sv').textContent='Add post';$('dl').hidden=true;draw()};
$('dl').onclick=()=>{P=P.filter(x=>x.id!==ed);save();ed=null;$('dl').hidden=true;$('sv').textContent='Add post';draw()};
$('pv').onclick=()=>{cur.setMonth(cur.getMonth()-1);draw()};$('nx').onclick=()=>{cur.setMonth(cur.getMonth()+1);draw()};
$('csv').onclick=()=>{if(!P.length)return;Shaynly.save(new Blob(['Date,Channel,Status,Title,Notes\n'+[...P].sort((a,b)=>a.d<b.d?-1:1).map(x=>[x.d,x.p,x.s,x.t,x.n||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'}),'content-calendar.csv')};$('d').value=iso(new Date());draw();
  </script>
</body>
</html>
