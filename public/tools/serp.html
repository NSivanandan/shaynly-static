  <link rel="canonical" href="https://shaynly.com/tools/serp.html">
    <!-- Site Icons & Favicon (SEO / Google Search / Apple Touch) -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <meta property="og:type" content="website">

  <meta property="og:title" content="SERP &amp; Social Card Simulator - Shaynly">
  <meta property="og:description" content="Simulate how your web pages appear in Google Search and social media cards.">
  <meta property="og:image" content="https://shaynly.com/assets/images/shaynly-og.png">

  <link rel="stylesheet" href="./core/shaynly.css">
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Google AdSense -->

  <!-- Google Analytics 4 -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SW10LSENP0', { link_ad_clicks: true, send_page_view: true });
  </script>
</head>
<body>
  <script src="./core/shaynly.js"></script>
  <script>
Shaynly.page('SERP & Social Previewer',`<div class="f"><label for="ti">Page title <span id="tc" class="muted"></span></label><input id="ti" value="Brand identity design for growing businesses"></div><div class="f"><label for="ds">Meta description <span id="dc" class="muted"></span></label><textarea id="ds" rows="3">We design logos, websites and marketing systems that help small businesses get found and remembered.</textarea></div><div class="f"><label for="ul">Page URL</label><input id="ul" value="https://example.com/services/branding"></div><div class="f"><label for="im">Social image (optional)</label><input type="file" id="im" accept="image/*"></div>`,'<div id="g" style="background:#fff;color:#202124;border:1px solid var(--line);border-radius:8px;padding:16px;font-family:Arial,sans-serif"></div><h2 style="margin:18px 0 10px">Social card</h2><div id="s" style="border:1px solid var(--line);border-radius:8px;overflow:hidden;max-width:420px;background:var(--paper)"></div>');
const $=i=>document.getElementById(i);let img='';const e=s=>s.replace(/[<&]/g,c=>c=='<'?'&lt;':'&amp;');
function r(){const t=$('ti').value,d=$('ds').value,u=$('ul').value;let h='';try{const x=new URL(u);h=x.hostname+x.pathname.replace(/\/$/,'').split('/').filter(Boolean).map(p=>' &rsaquo; '+p).join('')}catch{h=u}
 const tl=t.length,dl=d.length;$('tc').textContent=tl+' characters. '+(tl>60?'Likely cut off in Google (aim for 60 or fewer).':tl<30?'Short. Use the space.':'Good length.');$('tc').style.color=tl>60?'var(--bad)':'';
 $('dc').textContent=dl+' characters. '+(dl>155?'Likely cut off (aim for 155 or fewer).':dl<70?'Short. Add detail.':'Good length.');$('dc').style.color=dl>155?'var(--bad)':'';
 $('g').innerHTML=`<div style="font-size:12px;color:#4d5156">${e(h)}</div><div style="font-size:20px;color:#1a0dab;margin:2px 0 3px">${e(tl>60?t.slice(0,57)+'...':t)}</div><div style="font-size:14px;color:#4d5156;line-height:1.5">${e(dl>155?d.slice(0,152)+'...':d)}</div>`;
 let dom='';try{dom=new URL(u).hostname}catch{}$('s').innerHTML=(img?`<img src="${img}" alt="" style="width:100%;aspect-ratio:1.91/1;object-fit:cover;display:block">`:'<div class="muted" style="aspect-ratio:1.91/1;display:grid;place-items:center">Add an image (1200 &times; 630 works best)</div>')+`<div style="padding:10px 14px"><div class="muted">${e(dom)}</div><strong>${e(t)}</strong><div class="muted">${e(d.slice(0,110))}</div></div>`}
['ti','ds','ul'].forEach(i=>$(i).oninput=r);$('im').onchange=ev=>{const f=new FileReader();f.onload=()=>{img=f.result;r()};f.readAsDataURL(ev.target.files[0])};r();
  </script>
</body>
</html>
