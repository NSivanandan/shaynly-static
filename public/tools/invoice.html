<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice Generator</title><link rel="stylesheet" href="./core/shaynly.css"><style>#inv{background:#fff;color:#111;padding:28px;border:1px solid var(--line);border-radius:8px;font-size:13px}#inv table th,#inv table td{border-color:#ddd}@media print {
  /* Hide site header, navigation, footer, panels, and buttons */
  header.header, footer.footer, .panel:first-of-type, #pr, .toast, .adsbygoogle {
    display: none !important;
  }
  body, html {
    background: #ffffff !important;
    color: #000000 !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .wrap {
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .grid {
    display: block !important;
  }
  .panel:last-of-type {
    border: none !important;
    background: none !important;
    padding: 0 !important;
    box-shadow: none !important;
  }
  .panel:last-of-type h2 {
    display: none !important;
  }
  #inv {
    background: #ffffff !important;
    border: none !important;
    padding: 0 !important;
    width: 100% !important;
    margin: 0 !important;
    box-shadow: none !important;
  }
}</style>  <link rel="stylesheet" href="/assets/css/style.css">
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2218316924082551" crossorigin="anonymous"></script>
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SW10LSENP0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SW10LSENP0', { link_ad_clicks: true, send_page_view: true });
  </script>
</head><body><script src="./core/vendor/qrcode.js"></script><script src="./core/shaynly.js"></script><script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const B=Shaynly.brand(),st=Shaynly.store('invoice'),D=st.get({n:0,gst:'',upi:'',addr:'',notes:'Payment due within the stated days.'});let items=[{d:'Service',s:'998361',q:1,r:10000}];
const inp=(k,l,v='',t='text')=>`<div class="f"><label for="${k}">${l}</label><input id="${k}" type="${t}" value="${esc(v)}"></div>`;
Shaynly.page('Invoice Generator',`${inp('mg','Your GSTIN (blank if not registered)',D.gst)}${inp('ma','Your address',D.addr)}${inp('up','Your UPI ID for a pay QR (optional)',D.upi)}<div class="row">${inp('no','Invoice number',`INV-${new Date().getFullYear()}-${String(D.n+1).padStart(3,'0')}`)}${inp('dt','Date',new Date().toISOString().slice(0,10),'date')}${inp('dd','Due in days',15,'number')}</div>${inp('cn','Client name')}${inp('cg','Client GSTIN (optional)')}${inp('ca','Client address')}<div class="row"><div class="f"><label for="sp">Supply</label><select id="sp"><option value="intra">Same state (CGST + SGST)</option><option value="inter">Different state (IGST)</option></select></div>${inp('gr','GST %',18,'number')}${inp('ds','Discount %',0,'number')}</div><div id="it"></div><button class="btn alt" id="ai">Add line</button>${inp('nt','Notes or bank details',D.notes)}`,'<div id="inv"></div><div class="row" style="margin-top:14px"><button class="btn gold" id="pr">Print or save as PDF</button></div>');
function rows(){$('it').innerHTML=items.map((x,i)=>`<div class="row" style="margin-bottom:8px"><input style="flex:3" data-i="${i}" data-k="d" value="${esc(x.d)}" aria-label="Description"><input data-i="${i}" data-k="s" value="${esc(x.s)}" aria-label="SAC or HSN code"><input type="number" data-i="${i}" data-k="q" value="${x.q}" aria-label="Quantity"><input type="number" data-i="${i}" data-k="r" value="${x.r}" aria-label="Rate"><button class="btn alt" data-x="${i}" aria-label="Remove line" style="flex:0">x</button></div>`).join('')}
const W=n=>{const o=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],t=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'],b=n=>n<20?o[n]:t[n/10|0]+(n%10?' '+o[n%10]:''),c=n=>n>99?o[n/100|0]+' hundred'+(n%100?' '+b(n%100):''):b(n);let r='',cr=n/1e7|0,l=(n/1e5|0)%100,th=(n/1e3|0)%100,h=n%1000;if(cr)r+=c(cr)+' crore ';if(l)r+=c(l)+' lakh ';if(th)r+=c(th)+' thousand ';if(h)r+=c(h);return r.trim()||'zero'};
function draw(){const f=n=>Shaynly.fmt(n,'INR'),v=i=>$(i).value,gr=+v('gr')||0,ds=+v('ds')||0;const sub=items.reduce((a,x)=>a+x.q*x.r,0),dis=sub*ds/100,tx=sub-dis,tax=tx*gr/100,tot=Math.round(tx+tax),intra=v('sp')==='intra';
 const due=new Date(new Date(v('dt')).getTime()+(+v('dd')||0)*864e5).toISOString().slice(0,10);
 $('inv').innerHTML=`<div style="display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid ${B.color||'#1f6f6b'};padding-bottom:12px">${B.logo?`<img src="${B.logo}" alt="" style="max-height:54px">`:''}<div><b style="font-size:18px">${esc(B.name||'Your business')}</b><br>${esc(v('ma'))}<br>${v('mg')?'GSTIN: '+esc(v('mg')):''}</div><div style="text-align:right"><b style="font-size:18px">${v('mg')?'TAX INVOICE':'INVOICE'}</b><br>${esc(v('no'))}<br>Date: ${v('dt')}<br>Due: ${due}</div></div><p style="margin:12px 0"><b>Bill to</b><br>${esc(v('cn')||'Client name')}<br>${esc(v('ca'))}${v('cg')?'<br>GSTIN: '+esc(v('cg')):''}</p><table><tr><th>Description</th><th>SAC/HSN</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr>${items.map(x=>`<tr><td>${esc(x.d)}</td><td>${esc(x.s)}</td><td class="n">${x.q}</td><td class="n">${f(x.r)}</td><td class="n">${f(x.q*x.r)}</td></tr>`).join('')}</table><table style="width:60%;margin-left:auto;margin-top:10px"><tr><td>Subtotal</td><td class="n">${f(sub)}</td></tr>${ds?`<tr><td>Discount ${ds}%</td><td class="n">-${f(dis)}</td></tr>`:''}${intra?`<tr><td>CGST ${gr/2}%</td><td class="n">${f(tax/2)}</td></tr><tr><td>SGST ${gr/2}%</td><td class="n">${f(tax/2)}</td></tr>`:`<tr><td>IGST ${gr}%</td><td class="n">${f(tax)}</td></tr>`}<tr><th>Total (rounded)</th><th class="n">${f(tot)}</th></tr></table><p style="margin-top:10px"><i>Rupees ${W(tot)} only</i></p><div style="display:flex;justify-content:space-between;align-items:end;margin-top:14px"><p style="max-width:60%">${esc(v('nt'))}</p><div id="uq"></div></div>`;
 if(v('up')){const q=qrcode(0,'M');q.addData(`upi://pay?pa=${encodeURIComponent(v('up'))}&pn=${encodeURIComponent(B.name||'')}&am=${tot}&cu=INR&tn=${encodeURIComponent(v('no'))}`);q.make();$('uq').innerHTML=q.createImgTag(3,4)+'<div class="muted">Scan to pay</div>'}}
$('it').oninput=e=>{const d=e.target.dataset;if(d.i!==undefined){items[d.i][d.k]=['q','r'].includes(d.k)?+e.target.value||0:e.target.value;draw()}};
$('it').onclick=e=>{if(e.target.dataset.x!==undefined&&items.length>1){items.splice(+e.target.dataset.x,1);rows();draw()}};$('ai').onclick=()=>{items.push({d:'',s:'998361',q:1,r:0});rows();draw()};
document.querySelector('.grid').addEventListener('input',()=>{D.gst=$('mg').value;D.addr=$('ma').value;D.upi=$('up').value;D.notes=$('nt').value;st.set(D);draw()});
$('pr').onclick=()=>{D.n++;st.set(D);window.print()};rows();draw();
</script></body></html>
