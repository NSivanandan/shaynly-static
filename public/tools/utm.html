<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UTM Campaign Link Builder - Shaynly</title>
  <meta name="description" content="Generate Google Analytics UTM tracking links with instant QR code generation and local link history. 100% free and client-side.">
  <link rel="canonical" href="https://shaynly.com/tools/utm.html">
    <!-- Site Icons & Favicon (SEO / Google Search / Apple Touch) -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Shaynly">
  <meta name="application-name" content="Shaynly">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Shaynly">
  <meta property="og:url" content="https://shaynly.com/tools/utm.html">
  <meta property="og:title" content="UTM Campaign Link Builder - Shaynly">
  <meta property="og:description" content="Generate Google Analytics UTM tracking links with instant QR code generation.">
  <meta property="og:image" content="https://shaynly.com/assets/images/shaynly-og.png">

  <link rel="stylesheet" href="./core/shaynly.css">
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2218316924082551" crossorigin="anonymous"></script>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SW10LSENP0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SW10LSENP0', { link_ad_clicks: true, send_page_view: true });
  </script>
</head>
<body>
  <script src="./core/vendor/qrcode.js"></script>
  <script src="./core/shaynly.js"></script>
  <script>
Shaynly.page('UTM Link Builder',`${[['u','Page URL','https://example.com/offer'],['s','Source (where it appears)','linkedin'],['m','Medium (type of channel)','social'],['c','Campaign name','diwali-sale'],['t','Term (optional)',''],['n','Content (optional)','']].map(([k,l,v])=>`<div class="f"><label for="${k}">${l}</label><input id="${k}" value="${v}"></div>`).join('')}`,'<textarea id="o" rows="4" readonly style="width:100%;font-family:monospace;font-size:12px"></textarea><p class="err" id="er" role="alert"></p><div class="row" style="margin:10px 0"><button class="btn gold" id="cp">Copy link</button><button class="btn alt" id="sv">Save to history</button><button class="btn alt" id="share-utm">🔗 Share Preset</button></div><div id="qr" style="margin:12px 0"></div><h2 style="font-size:1rem;margin-top:14px">History</h2><div id="h"></div>');
const $=i=>document.getElementById(i),st=Shaynly.store('utm'),slug=v=>v.trim().toLowerCase().replace(/\s+/g,'-');let url='';
function r(){const er=$('er');er.textContent='';url='';$('qr').innerHTML='';try{const x=new URL($('u').value.trim());if(!/^https?:/.test(x.protocol))throw 0;if(!$('s').value||!$('m').value||!$('c').value){er.textContent='Source, medium and campaign are required.';$('o').value='';return}
 [['utm_source','s'],['utm_medium','m'],['utm_campaign','c'],['utm_term','t'],['utm_content','n']].forEach(([p,k])=>{if($(k).value.trim())x.searchParams.set(p,slug($(k).value))});url=x.toString();$('o').value=url;const q=qrcode(0,'M');q.addData(url);q.make();$('qr').innerHTML=q.createImgTag(5,8)}catch{er.textContent='Enter a full page address starting with https://';$('o').value=''}}
function h(){const l=st.get([]);$('h').innerHTML=l.length?'<table>'+l.map((x,i)=>`<tr><td style="word-break:break-all;font-size:.8rem">${x.replace(/</g,'&lt;')}</td><td><button class="btn alt" data-i="${i}">Copy</button></td></tr>`).join('')+'</table>':'<p class="muted">Saved links appear here.</p>'}
$('h').onclick=e=>{const i=e.target.dataset.i;if(i)Shaynly.copy(st.get([])[i])};
document.querySelector('.grid').oninput=r;$('cp').onclick=()=>url&&Shaynly.copy(url);$('sv').onclick=()=>{if(!url)return;st.set([url,...st.get([])].slice(0,30));h();Shaynly.toast('Saved')};r();h();
// URL Parameter Preset Loading & Preset Sharing
(function(){
  try {
    const p = new URLSearchParams(window.location.search);
    if(p.get('u') && $('u')) $('u').value = p.get('u');
    if(p.get('s') && $('s')) $('s').value = p.get('s');
    if(p.get('m') && $('m')) $('m').value = p.get('m');
    if(p.get('c') && $('c')) $('c').value = p.get('c');
    if(p.get('t') && $('t')) $('t').value = p.get('t');
    if(p.get('n') && $('n')) $('n').value = p.get('n');
    r();
    const sBtn = $('share-utm');
    if(sBtn){
      sBtn.onclick = function(){
        const u = window.location.origin + window.location.pathname + '?u=' + encodeURIComponent($('u').value) + '&s=' + encodeURIComponent($('s').value) + '&m=' + encodeURIComponent($('m').value) + '&c=' + encodeURIComponent($('c').value);
        Shaynly.copy(u);
        Shaynly.toast('Preset link copied to clipboard!');
      };
    }
  } catch(e){}
})();

  </script>
</body>
</html>
