<body>
  <script src="./core/vendor/html2canvas.min.js"></script>
  <script src="./core/vendor/jspdf.min.js"></script>
  <script src="./core/shaynly.js"></script>
  <script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const A=[['Technical','HTTPS on every page',3,'Browsers flag non-secure pages and it is a baseline trust signal.'],['Technical','Key pages are indexable (no accidental noindex)',3,'A stray noindex removes a page from Google entirely.'],['Technical','XML sitemap submitted in Search Console',2,'Helps discovery; check the Pages report for exclusions.'],['Technical','robots.txt does not block key pages or the AI crawlers you want',3,'Blocking GPTBot, ClaudeBot or PerplexityBot removes you from those tools; decide on purpose.'],['Technical','Canonical tags set where duplicate URLs exist',2,'Prevents split signals across parameter and duplicate URLs.'],['Technical','Largest Contentful Paint 2.5 s or less',2,'Google "good" threshold for field data at the 75th percentile.'],['Technical','Interaction to Next Paint 200 ms or less',2,'Google "good" threshold; INP replaced FID in March 2024.'],['Technical','Cumulative Layout Shift 0.1 or less',2,'Google "good" threshold.'],['Technical','Layout works on mobile',2,'Google indexes the mobile version first.'],
['On-page','Unique, descriptive title on every page',3,'Titles are a strong relevance signal and the clickable headline.'],['On-page','Unique meta description on key pages',1,'Not a ranking factor, but it shapes click-through.'],['On-page','One clear H1 per page',2,'Best practice for structure, not a Google requirement.'],['On-page','Descriptive alt text on meaningful images',1,'Accessibility first; also helps image search.'],['On-page','Descriptive internal links to key pages',2,'Anchor text tells crawlers and readers what the target is.'],
['Content and answers','Each page answers its main question in the first 40 to 60 words',3,'A practitioner heuristic, not a published rule. Direct answers are easy for people and AI tools to lift.'],['Content and answers','Question-style subheadings, each followed by a direct answer',2,'Mirrors how people phrase prompts.'],['Content and answers','Lists or tables for steps and comparisons',1,'Scannable structure is easier to quote accurately.'],['Content and answers','Original data, examples or first-hand experience',3,'Google guidance rewards experience and original value over rewritten content.'],['Content and answers','Named author, credentials and a visible updated date',2,'Supports trust and lets readers judge freshness.'],
['Entities and schema','Organization schema with sameAs links',2,'Helps connect your site to your official profiles.'],['Entities and schema','Schema matches what is visible on the page',2,'Markup that misdescribes the page can be ignored or penalised.'],['Entities and schema','Consistent name, address and phone across the web',2,'Consistency reduces entity confusion.'],['Entities and schema','Google Business Profile claimed (local businesses)',2,'Primary driver of map pack visibility.'],['Entities and schema','Mentioned by third-party sites, reviews or press',3,'Independent mentions are a common thread in what AI tools cite.'],
['AI access','Important content is in the HTML, not only added by JavaScript',2,'Some crawlers do not run JavaScript, so content may be invisible to them.'],['AI access','llms.txt published (optional)',1,'No major AI search provider has confirmed using it. Cheap to add, so low priority.']];
Shaynly.page('SEO & AEO Audit Checklist',`<div class="f"><label for="cl">Client or site</label><input id="cl" placeholder="e.g. Acme Dental" list="cls"><datalist id="cls"></datalist></div><p class="muted">Progress saves per client on this device. Weighted by impact (1 to 3).</p><div id="sc" style="margin-top:14px"></div><button class="btn gold" id="pr" style="margin-top:14px">Download Audit PDF</button>`,'<div id="l"></div>');
const st=Shaynly.store('audit');let all=st.get({}),cur='';
function save(){all[cur]=all[cur]||{};st.set(all)}
function render(){const done=all[cur]||{};let tot=0,got=0,g={};A.forEach((a,i)=>{tot+=a[2];if(done[i])got+=a[2];(g[a[0]]=g[a[0]]||[0,0])[0]+=done[i]?a[2]:0;g[a[0]][1]+=a[2]});const p=Math.round(got/tot*100);
 $('sc').innerHTML=`<div class="big">${p}/100</div><div class="meter"><i style="width:${p}%"></i></div>`+Object.entries(g).map(([k,v])=>`<div class="muted" style="margin-top:8px">${k}: ${Math.round(v[0]/v[1]*100)}%</div>`).join('');
 const top=A.map((a,i)=>[a,i]).filter(([a,i])=>!done[i]).sort((x,y)=>y[0][2]-x[0][2]).slice(0,3);
 let last='';$('l').innerHTML=(top.length?`<p style="margin-bottom:10px"><b>Fix first:</b> ${top.map(([a])=>esc(a[1])).join('; ')}.</p>`:'')+A.map((a,i)=>{const h=a[0]!==last?`<h2 style="margin:16px 0 4px;font-size:1rem">${a[0]}</h2>`:'';last=a[0];return h+`<label class="chk"><input type="checkbox" data-i="${i}" ${done[i]?'checked':''}><span>${esc(a[1])} <span class="muted">(weight ${a[2]})</span><small>${esc(a[3])}</small></span></label>`}).join('')}
$('l').onchange=e=>{if(e.target.dataset.i===undefined)return;save();all[cur][e.target.dataset.i]=e.target.checked;st.set(all);render()};
$('cl').oninput=()=>{cur=$('cl').value.trim()||'Untitled';all[cur]=all[cur]||{};render()};$('cls').innerHTML=Object.keys(all).map(k=>`<option>${esc(k)}</option>`).join('');

$('pr').onclick = async () => {
  const btn = $('pr');
  const origText = btn.textContent;
  btn.textContent = 'Generating Audit PDF...';
  btn.disabled = true;

  try {
    const panels = document.querySelectorAll('.panel');
    const targetEl = panels[1] || document.querySelector('.grid');
    if (!targetEl) throw new Error('Audit results container not found');

    const canvas = await html2canvas(targetEl, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff',
      logging: false
    });

    const imgData = canvas.toDataURL('image/png');
    const clientName = cur || 'audit-report';
    const cleanName = clientName.replace(/[^a-zA-Z0-9_-]/g, '_');

    const jsPDFClass = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
    if (jsPDFClass) {
      const pdf = new jsPDFClass('p', 'mm', 'a4');
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
      pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
      pdf.save(`${cleanName}-seo-audit.pdf`);
    } else {
      const link = document.createElement('a');
      link.download = `${cleanName}-seo-audit.png`;
      link.href = imgData;
      link.click();
    }

    if (window.Shaynly && Shaynly.toast) {
      Shaynly.toast('Audit report downloaded successfully!');
    }
  } catch (err) {
    console.error('Audit export error:', err);
    alert('Export error: ' + err.message);
  } finally {
    btn.textContent = origText;
    btn.disabled = false;
  }
};

cur='Untitled';render();
  </script>
</body>
</html>
