<body>
  <script src="./core/shaynly.js"></script>
  <script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
Shaynly.page('Image Compressor & Converter',`<div class="f"><label for="f">Images (select many)</label><input id="f" type="file" accept="image/*" multiple></div><div class="row"><div class="f"><label for="fm">Output format</label><select id="fm"><option value="image/webp">WebP (smallest)</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select></div><div class="f"><label for="mw">Max width (px)</label><input id="mw" type="number" value="1600" min="100"></div></div><div class="f"><label for="q">Quality: <span id="qv">80</span>%</label><input id="q" type="range" min="30" max="100" value="80"></div><p class="muted">Works offline. Images never leave your device. PNG ignores the quality setting.</p>`,'<div id="r"><p class="muted">Choose images to start.</p></div><button class="btn gold" id="all" style="margin-top:12px;display:none">Download all</button>');
let out=[];const kb=n=>n>1048576?(n/1048576).toFixed(2)+' MB':Math.round(n/1024)+' KB',ext={'image/webp':'webp','image/jpeg':'jpg','image/png':'png'};
async function run(){const fs=[...$('f').files];out=[];$('qv').textContent=$('q').value;if(!fs.length)return;$('r').innerHTML='<p class="muted">Compressing images...</p>';
 for(const f of fs){const im=await createImageBitmap(f),s=Math.min(1,+$('mw').value/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');if($('fm').value==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,$('fm').value,+$('q').value/100));out.push({n:f.name.replace(/\.\w+$/,'')+'.'+ext[$('fm').value],b,o:f.size,w:c.width,h:c.height})}
 const to=out.reduce((a,x)=>a+x.o,0),tn=out.reduce((a,x)=>a+x.b.size,0);
 $('r').innerHTML=`<div class="big">${Math.max(0,Math.round((1-tn/to)*100))}% smaller</div><div class="muted">${kb(to)} to ${kb(tn)}</div><table style="margin-top:10px">`+out.map((x,i)=>`<tr><td>${esc(x.n)}<br><span class="muted">${x.w} &times; ${x.h}</span></td><td class="n">${kb(x.o)} to ${kb(x.b.size)}${x.b.size>x.o?'<br><span class="no">larger than original</span>':''}</td><td><button class="btn alt" data-i="${i}">Save</button></td></tr>`).join('')+'</table>';$('all').style.display='inline-flex'}
document.querySelector('.grid').onchange=run;$('q').oninput=()=>$('qv').textContent=$('q').value;
$('r').onclick=e=>{const i=e.target.dataset.i;if(i)Shaynly.save(out[i].b,out[i].n)};$('all').onclick=()=>out.forEach((x,i)=>setTimeout(()=>Shaynly.save(x.b,x.n),i*300));
  </script>
</body>
