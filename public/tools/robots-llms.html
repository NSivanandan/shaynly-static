<head>

  <link rel="canonical" href="https://shaynly.com/tools/robots-llms.html">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">

  <meta property="og:title" content="robots.txt &amp; llms.txt AI File Generator - Shaynly">
  <meta property="og:description" content="Generate production robots.txt and modern llms.txt files with granular AI crawler controls.">
  <meta property="og:image" content="https://shaynly.com/assets/images/shaynly-og.png">

  <link rel="stylesheet" href="./core/shaynly.css">
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2218316924082551" crossorigin="anonymous"></script>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SW10LSENP0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SW10LSENP0', { link_ad_clicks: true, send_page_view: true });
  </script>
</head>
<body>
  <script src="./core/shaynly.js"></script>
  <script>
const BOTS=[['GPTBot','OpenAI training'],['OAI-SearchBot','ChatGPT search'],['ChatGPT-User','ChatGPT browsing'],['ClaudeBot','Anthropic training'],['Claude-SearchBot','Claude search'],['PerplexityBot','Perplexity'],['Google-Extended','Gemini training'],['CCBot','Common Crawl']];
const B=Shaynly.brand();
Shaynly.page('robots.txt & llms.txt',`<div class="f"><label for="site">Website</label><input id="site" value="${B.website||'https://example.com'}"></div><div class="f"><label>AI crawlers (tick to allow)</label>${BOTS.map(([b,d])=>`<label style="display:flex;gap:8px;margin:4px 0;color:var(--ink)"><input type="checkbox" style="width:auto" data-b="${b}" checked>${b} <span class="muted">${d}</span></label>`).join('')}</div><div class="f"><label for="dis">Paths to keep private (one per line)</label><textarea id="dis" rows="3">/admin/\n/cart/</textarea></div><div class="f"><label for="sum">One-line summary for llms.txt</label><input id="sum" value="${B.name?B.name+' helps clients grow online.':'Describe your business in one sentence.'}"></div><div class="f"><label for="pg">Key pages (Title | URL | note, one per line)</label><textarea id="pg" rows="4">Services | /services | What we offer\nAbout | /about | Who we are</textarea></div>`,'<h2 style="font-size:1rem">robots.txt</h2><textarea id="r" rows="10" readonly style="font:12px ui-monospace,monospace;width:100%"></textarea><div class="row" style="margin:8px 0 16px"><button class="btn gold" id="d1">Download robots.txt</button><button class="btn alt" id="c1">Copy</button></div><h2 style="font-size:1rem">llms.txt</h2><textarea id="l" rows="9" readonly style="font:12px ui-monospace,monospace;width:100%"></textarea><div class="row" style="margin-top:8px"><button class="btn gold" id="d2">Download llms.txt</button><button class="btn alt" id="c2">Copy</button></div><p class="muted" style="margin-top:10px">Blocking a crawler only affects bots that respect robots.txt. No one can promise that llms.txt changes AI answers, so treat it as a clear, low-cost summary.</p>');
const $=i=>document.getElementById(i),ls=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
function r(){const site=$('site').value.replace(/\/$/,''),dis=ls($('dis').value);let o='User-agent: *\n'+(dis.length?dis.map(d=>'Disallow: '+d).join('\n'):'Disallow:')+'\n';
 document.querySelectorAll('[data-b]').forEach(c=>{o+='\nUser-agent: '+c.dataset.b+'\n'+(c.checked?'Allow: /':'Disallow: /')+'\n'});o+='\nSitemap: '+site+'/sitemap.xml\n';$('r').value=o;
 $('l').value='# '+(Shaynly.brand().name||site.replace(/^https?:\/\//,''))+'\n\n> '+$('sum').value+'\n\n## Key pages\n'+ls($('pg').value).map(l=>{const [t,u,n]=l.split('|').map(x=>x.trim());return`- [${t}](${(u||'').startsWith('http')?u:site+(u||'')})${n?': '+n:''}`}).join('\n')+'\n'}
document.querySelector('.grid').oninput=r;$('c1').onclick=()=>Shaynly.copy($('r').value);$('c2').onclick=()=>Shaynly.copy($('l').value);
$('d1').onclick=()=>Shaynly.save(new Blob([$('r').value]),'robots.txt');$('d2').onclick=()=>Shaynly.save(new Blob([$('l').value]),'llms.txt');r();
  </script>
</body>
</html>
