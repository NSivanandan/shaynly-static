<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JSON-LD Schema Markup Generator - Shaynly</title>
  <meta name="description" content="Generate Google-compliant JSON-LD structured data schema for FAQs, Local Business, Products, Organizations, Articles, and How-Tos.">
  <link rel="canonical" href="https://shaynly.com/tools/schema.html">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Shaynly">
  <meta property="og:url" content="https://shaynly.com/tools/schema.html">
  <meta property="og:title" content="JSON-LD Schema Markup Generator - Shaynly">
  <meta property="og:description" content="Generate Google-compliant JSON-LD structured data schema for FAQs, Local Business, and Articles.">
  <meta property="og:image" content="https://shaynly.com/assets/images/shaynly-og.png">

  <link rel="stylesheet" href="./core/shaynly.css">
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2218316924082551" crossorigin="anonymous"></script>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SW10LSENP0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SW10LSENP0', { link_ad_clicks: true, send_page_view: true });
  </script>
</head>
<body>
  <script src="./core/shaynly.js"></script>
  <script>
const T={faq:[['faqs','Questions and answers','area','Separate each pair with a blank line. First line is the question; the rest is the answer.']],
org:[['name','Name'],['url','Website'],['logo','Logo URL'],['email','Email'],['phone','Phone'],['sameAs','Social links (one per line)','area']],
local:[['name','Business name'],['url','Website'],['phone','Phone'],['street','Street address'],['city','City'],['region','State'],['postal','PIN code'],['country','Country code','IN'],['price','Price range','$$']],
product:[['name','Product name'],['description','Description','area'],['image','Image URL'],['brand','Brand'],['price','Price'],['currency','Currency','INR'],['url','Product page URL']],
article:[['headline','Headline'],['author','Author'],['date','Date published (YYYY-MM-DD)'],['image','Image URL'],['publisher','Publisher name'],['url','Page URL']],
howto:[['name','Title'],['steps','Steps (one per line)','area']]};
Shaynly.page('Schema Generator',`<div class="f"><label for="t">Schema type</label><select id="t"><option value="faq">FAQ page</option><option value="org">Organization</option><option value="local">Local business</option><option value="product">Product</option><option value="article">Article</option><option value="howto">How-to</option></select></div><div id="fs"></div>`,'<textarea id="o" rows="18" readonly style="font:12px/1.4 ui-monospace,monospace;width:100%"></textarea><p class="err" id="er" role="alert"></p><div class="row" style="margin-top:12px"><button class="btn gold" id="cp">Copy script tag</button><button class="btn alt" id="dl">Download .json</button></div><p class="muted" style="margin-top:10px">Paste into your page head, then check it with Google Rich Results Test.</p>');
const $=i=>document.getElementById(i),B=Shaynly.brand(),map={name:B.name,url:B.website,email:B.email,phone:B.phone,city:B.city,sameAs:B.sameAs,publisher:B.name,brand:B.name};let data;
function form(){$('fs').innerHTML=T[$('t').value].map(([k,l,x,h])=>{const a=x==='area',v=map[k]||(!a&&x)||'';return`<div class="f"><label for="f_${k}">${l}</label>${a?`<textarea rows=${k==='faqs'?9:3} id="f_${k}">${map[k]||''}</textarea>`:`<input id="f_${k}" value="${v}">`}${h?`<span class="muted">${h}</span>`:''}</div>`}).join('');$('fs').oninput=gen;gen()}
const g=k=>(document.getElementById('f_'+k)?.value||'').trim(),L=k=>g(k).split('\n').map(x=>x.trim()).filter(Boolean),C=o=>Object.fromEntries(Object.entries(o).filter(([,v])=>v&&(!Array.isArray(v)||v.length)));
function gen(){const t=$('t').value,er=$('er');er.textContent='';let d;
 if(t==='faq'){const p=g('faqs').split(/\n\s*\n/).map(x=>x.trim().split('\n')).filter(x=>x.length>1);if(!p.length){er.textContent='Add at least one question with an answer below it.'}d={'@type':'FAQPage',mainEntity:p.map(x=>({'@type':'Question',name:x[0].trim(),acceptedAnswer:{'@type':'Answer',text:x.slice(1).join(' ').trim()}}))}}
 if(t==='org')d=C({'@type':'Organization',name:g('name'),url:g('url'),logo:g('logo'),email:g('email'),telephone:g('phone'),sameAs:L('sameAs')});
 if(t==='local')d=C({'@type':'LocalBusiness',name:g('name'),url:g('url'),telephone:g('phone'),priceRange:g('price'),address:C({'@type':'PostalAddress',streetAddress:g('street'),addressLocality:g('city'),addressRegion:g('region'),postalCode:g('postal'),addressCountry:g('country')})});
 if(t==='product')d=C({'@type':'Product',name:g('name'),description:g('description'),image:g('image'),brand:g('brand')&&{'@type':'Brand',name:g('brand')},offers:g('price')&&C({'@type':'Offer',price:g('price'),priceCurrency:g('currency'),url:g('url'),availability:'https://schema.org/InStock'})});
 if(t==='article')d=C({'@type':'Article',headline:g('headline'),author:g('author')&&{'@type':'Person',name:g('author')},datePublished:g('date'),image:g('image'),publisher:g('publisher')&&{'@type':'Organization',name:g('publisher')},mainEntityOfPage:g('url')});
 if(t==='howto'){if(!L('steps').length)er.textContent='Add at least one step.';d=C({'@type':'HowTo',name:g('name'),step:L('steps').map((s,i)=>({'@type':'HowToStep',position:i+1,text:s}))})}
 if(!er.textContent&&!g(t==='faq'?'faqs':t==='article'?'headline':'name'))er.textContent='Fill in the first field to complete the markup.';
 data=JSON.stringify({'@context':'https://schema.org',...d},null,2);$('o').value='<script type="application/ld+json">\n'+data+'\n<\/script>'}
$('t').onchange=form;$('cp').onclick=()=>Shaynly.copy($('o').value);$('dl').onclick=()=>Shaynly.save(new Blob([data],{type:'application/ld+json'}),'schema-'+$('t').value+'.json');form();
  </script>
</body>
</html>
