<body>
  <script src="./core/vendor/qrcode.js"></script>

  <script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
Shaynly.page('WhatsApp Link Generator',`<div class="row"><div class="f"><label for="cc">Country code</label><input id="cc" value="91" inputmode="numeric"></div><div class="f" style="flex:3"><label for="no">Phone number</label><input id="no" inputmode="numeric" placeholder="98765 43210"></div></div><div class="f"><label for="tp">Message template</label><select id="tp"><option value="">Custom</option><option>Hi! I found you online and would like to know more about your services.</option><option>Hi, I'd like to book an appointment. What times are available?</option><option>Hello, please send me a quote for my project.</option></select></div><div class="f"><label for="ms">Pre-filled message</label><textarea id="ms" rows="3"></textarea></div>`,'<textarea id="o" rows="2" readonly style="width:100%;font-family:monospace;font-size:12px"></textarea><p class="err" id="er" role="alert"></p><div class="row" style="margin:10px 0"><button class="btn gold" id="cp">Copy link</button><a class="btn alt" id="op" target="_blank" rel="noopener">Test link</a></div><div id="qr"></div><p class="muted" style="margin-top:10px">Format: country code plus number, digits only, no + or leading zeros. The international limit is 15 digits.</p>');
let u='';function r(){const n=($('cc').value+$('no').value).replace(/\D/g,'').replace(/^0+/,''),er=$('er');er.textContent='';$('qr').innerHTML='';u='';
 if(n.length<8||n.length>15){er.textContent='Enter a valid number: 8 to 15 digits including the country code.';$('o').value='';return}
 u='https://wa.me/'+n+($('ms').value.trim()?'?text='+encodeURIComponent($('ms').value.trim()):'');$('o').value=u;$('op').href=u;const q=qrcode(0,'M');q.addData(u);q.make();$('qr').innerHTML=q.createImgTag(5,8)}
$('tp').onchange=()=>{$('ms').value=$('tp').value;r()};document.querySelector('.grid').oninput=r;$('cp').onclick=()=>u&&Shaynly.copy(u);r();
  </script>
