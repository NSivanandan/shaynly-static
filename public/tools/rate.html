<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tool</title><link rel="stylesheet" href="../core/shaynly.css"></head><body><script src="../core/shaynly.js"></script><script>
Shaynly.page('Freelance Rate Calculator',`<div class="f"><label for="cu">Currency</label><select id="cu"><option>INR</option><option>USD</option><option>GBP</option><option>CAD</option></select></div>${[['inc','Take-home income you want per month',100000],['exp','Business costs per month (tools, rent, internet)',15000],['tax','Tax set-aside %',20],['hrs','Working hours per week',40],['bil','Share of hours you can bill %',60],['off','Weeks off per year',6],['ph','Hours in the project you are pricing',30]].map(([k,l,v])=>`<div class="f"><label for="${k}">${l}</label><input id="${k}" type="number" min="0" step="any" value="${v}"></div>`).join('')}`,'<div class="muted">Hourly rate</div><div class="big" id="h">–</div><table id="t" style="margin-top:12px"></table><p class="err" id="er" role="alert"></p>');
const $=i=>document.getElementById(i),v=i=>+$(i).value;
function r(){const er=$('er');er.textContent='';const wk=52-v('off'),bh=v('hrs')*v('bil')/100*wk;if(!(bh>0)||v('tax')>=100){er.textContent='Billable hours must be above zero and tax below 100%.';return}
 const need=(v('inc')/(1-v('tax')/100)+v('exp'))*12,h=need/bh,f=n=>Shaynly.fmt(Math.ceil(n),$('cu').value);$('h').textContent=f(h);
 $('t').innerHTML=[['Day rate (8 billable hours)',f(h*8)],['Price for this project',f(h*v('ph'))],['Price with 20% buffer for revisions',f(h*v('ph')*1.2)],['Yearly revenue needed',f(need)],['Billable hours per year',Math.round(bh).toLocaleString()]].map(x=>`<tr><td>${x[0]}</td><td class="n">${x[1]}</td></tr>`).join('')}
document.querySelector('.grid').oninput=r;r();
</script></body></html>
