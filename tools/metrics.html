<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tool</title><link rel="stylesheet" href="../core/shaynly.css"></head><body><script src="../core/vendor/qrcode.js"></script><script src="../core/shaynly.js"></script><script>const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
Shaynly.page('Marketing Metrics Calculator',`<div class="f"><label for="cu">Currency</label><select id="cu"><option>INR</option><option>USD</option><option>GBP</option><option>CAD</option></select></div>${[['sp','Ad spend',50000],['rv','Revenue from those ads',150000],['gm','Gross margin %',40],['nc','New customers won',60],['ao','Average order value',2500],['pp','Purchases per customer per year',2],['yr','Years a customer stays',2]].map(([k,l,v])=>`<div class="f"><label for="${k}">${l}</label><input id="${k}" type="number" min="0" step="any" value="${v}"></div>`).join('')}`,'<div id="o"></div>');
function r(){const v=i=>+$(i).value,f=n=>Shaynly.fmt(n,$('cu').value),m=v('gm')/100;if(!(v('sp')>0)||!(m>0)||!(v('nc')>0)){$('o').innerHTML='<p class="err">Spend, margin and new customers must be above zero.</p>';return}
 const roas=v('rv')/v('sp'),be=1/m,profit=v('rv')*m-v('sp'),cac=v('sp')/v('nc'),ltv=v('ao')*m*v('pp')*v('yr'),ratio=ltv/cac,pay=cac/(v('ao')*m);
 const rows=[['ROAS (revenue / spend)',roas.toFixed(2)+'x'],['Break-even ROAS (1 / margin)',be.toFixed(2)+'x'],['Profit after ad spend',f(profit)],['CAC (spend / new customers)',f(cac)],['Lifetime value (gross profit)',f(ltv)],['LTV : CAC',ratio.toFixed(1)+' : 1'],['Orders to repay CAC',pay.toFixed(1)]];
 $('o').innerHTML=`<div class="big" style="color:${profit>=0?'var(--teal)':'var(--bad)'}">${f(profit)}</div><table>${rows.map(x=>`<tr><td>${x[0]}</td><td class="n">${x[1]}</td></tr>`).join('')}</table><p style="margin-top:12px">${roas<be?`Each ${f(1)} of spend returns ${f(roas)} in revenue, below the ${be.toFixed(2)}x needed to cover costs at this margin, so these ads lose money on the first order.`:`ROAS is above break-even, so the first order is profitable.`} ${ratio<3?'LTV:CAC is under the common 3:1 rule of thumb; improve retention or lower CAC.':'LTV:CAC meets the common 3:1 rule of thumb.'}</p><p class="muted">ROAS uses revenue, so it ignores margin. Break-even ROAS is what makes it comparable. LTV here uses gross profit, not revenue.</p>`}
document.querySelector('.grid').oninput=r;r();
</script></body></html>
