<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tool</title><link rel="stylesheet" href="../core/shaynly.css"></head><body><script src="../core/vendor/qrcode.js"></script><script src="../core/shaynly.js"></script><script>const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=['ChatGPT','Gemini','Perplexity','Claude','Google AI Overview','Copilot'],S=['Cited with link','Mentioned, no link','Not mentioned'];
Shaynly.page('AI Visibility Tracker',`<p class="muted" style="margin-bottom:12px">Ask each AI tool your target question, then log what it said. Answers vary between runs, so repeat each prompt at least 3 times.</p><div class="f"><label for="pr">Prompt</label><input id="pr" placeholder="best dental clinic in Indiranagar"></div><div class="row"><div class="f"><label for="pl">Platform</label><select id="pl">${P.map(p=>`<option>${p}</option>`)}</select></div><div class="f"><label for="rs">Result</label><select id="rs">${S.map(p=>`<option>${p}</option>`)}</select></div></div><div class="row"><div class="f"><label for="dt">Date</label><input type="date" id="dt"></div><div class="f"><label for="cp">Competitor named (optional)</label><input id="cp"></div></div><button class="btn gold" id="ad">Log result</button> <button class="btn alt" id="cv">Export CSV</button>`,'<div id="st"></div><div id="tb" style="margin-top:14px;max-height:340px;overflow:auto"></div>');
const s=Shaynly.store('tracker');let L=s.get([]);$('dt').valueAsDate=new Date();
const rate=a=>a.length?Math.round(a.filter(x=>x.r!==S[2]).length/a.length*100):0;
function render(){const by=(k)=>L.reduce((m,x)=>((m[x[k]]=m[x[k]]||[]).push(x),m),{});
 const pl=Object.entries(by('p')).map(([k,v])=>`<div class="row" style="align-items:center;gap:8px;margin:4px 0"><span style="flex:0 0 130px">${esc(k)}</span><div class="meter" style="flex:1"><i style="width:${rate(v)}%"></i></div><span class="muted" style="flex:0 0 70px">${rate(v)}% of ${v.length}</span></div>`).join('');
 const pr=Object.entries(by('q')).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.length}</td><td class="n">${rate(v)}%</td></tr>`).join('');
 const co={};L.forEach(x=>x.c&&(co[x.c.toLowerCase()]=(co[x.c.toLowerCase()]||0)+1));const tc=Object.entries(co).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${esc(k)} (${v})`).join(', ');
 $('st').innerHTML=L.length?`<div class="big">${rate(L)}%</div><div class="muted">of ${L.length} checks mentioned or cited you</div><h2 style="font-size:1rem;margin:12px 0 4px">By platform</h2>${pl}<h2 style="font-size:1rem;margin:12px 0 4px">By prompt</h2><table><tr><th>Prompt</th><th class="n">Runs</th><th class="n">Appeared</th></tr>${pr}</table>${tc?`<p class="muted" style="margin-top:8px">Competitors named most: ${tc}</p>`:''}`:'<p class="muted">Log your first check to see your visibility rate.</p>';
 $('tb').innerHTML=L.length?'<table>'+L.map((x,i)=>`<tr><td>${x.d}</td><td>${esc(x.p)}</td><td>${esc(x.q)}</td><td>${esc(x.r)}</td><td><button class="btn alt" data-i="${i}" aria-label="Delete">Delete</button></td></tr>`).join('')+'</table>':''}
$('ad').onclick=()=>{if(!$('pr').value.trim()){Shaynly.toast('Enter the prompt you tested');return}L.unshift({q:$('pr').value.trim().toLowerCase(),p:$('pl').value,r:$('rs').value,d:$('dt').value,c:$('cp').value.trim()});s.set(L);render()};
$('tb').onclick=e=>{if(e.target.dataset.i){L.splice(+e.target.dataset.i,1);s.set(L);render()}};
$('cv').onclick=()=>{if(!L.length)return;Shaynly.save(new Blob(['Date,Platform,Prompt,Result,Competitor\n'+L.map(x=>[x.d,x.p,x.q,x.r,x.c].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'}),'ai-visibility.csv')};render();
</script></body></html>
