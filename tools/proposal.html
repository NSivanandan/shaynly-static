<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tool</title><link rel="stylesheet" href="../core/shaynly.css"></head><body><script src="../core/shaynly.js"></script><script>const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const B=Shaynly.brand(),st=Shaynly.store('proposal'),D=st.get({n:0}),inp=(k,l,v='',t='text')=>`<div class="f"><label for="${k}">${l}</label><input id="${k}" type="${t}" value="${esc(v)}"></div>`;let it=[{d:'Strategy and setup',r:25000,o:0,on:1},{d:'Monthly management',r:40000,o:0,on:1},{d:'Extra landing page',r:12000,o:1,on:0}];
Shaynly.page('Proposal & Quote Builder',`<div class="row">${inp('cn','Client name')}${inp('pt','Project title','Growth proposal')}</div><div class="row">${inp('no','Quote no.',`Q-${new Date().getFullYear()}-${String(D.n+1).padStart(3,'0')}`)}${inp('dt','Date',new Date().toISOString().slice(0,10),'date')}${inp('vd','Valid for (days)',14,'number')}</div><div class="f"><label for="sc">Scope and approach</label><textarea id="sc" rows="4">Describe what you will deliver and how.</textarea></div><div id="it"></div><button class="btn alt" id="ai">Add line</button><div class="row" style="margin-top:12px">${inp('gr','GST % (0 if none)',18,'number')}<div class="f"><label for="cu">Currency</label><select id="cu"><option>INR</option><option>USD</option><option>GBP</option><option>CAD</option></select></div></div><div class="f"><label for="ms">Payment milestones (Name | %)</label><textarea id="ms" rows="3">Advance on acceptance | 50\nOn delivery | 50</textarea></div><div class="f"><label for="tm">Terms</label><textarea id="tm" rows="3">Prices exclude third-party costs such as ad spend. Work begins after the advance is received. Changes to scope are quoted separately.</textarea></div>`,'<div id="inv" style="background:#fff;color:#111;padding:28px;border:1px solid var(--line);border-radius:8px;font-size:13px"></div><button class="btn gold" id="pr" style="margin-top:14px">Print or save as PDF</button><p class="muted" style="margin-top:8px">Optional items show a tick box in the preview. Tick what the client chooses and the total updates.</p><style>#inv th,#inv td{border-color:#ddd}@media print{body *{visibility:hidden}#inv,#inv *{visibility:visible}#inv{position:absolute;left:0;top:0;width:100%;border:0}.noprint{display:none!important}}</style>');
function rows(){$('it').innerHTML=it.map((x,i)=>`<div class="row" style="margin-bottom:8px"><input style="flex:3" data-i="${i}" data-k="d" value="${esc(x.d)}" aria-label="Item"><input type="number" data-i="${i}" data-k="r" value="${x.r}" aria-label="Price"><label style="flex:0 0 auto;white-space:nowrap"><input type="checkbox" style="width:auto" data-i="${i}" data-k="o" ${x.o?'checked':''}> optional</label><button class="btn alt" data-x="${i}" style="flex:0" aria-label="Remove">x</button></div>`).join('')}
function draw(){const v=i=>$(i).value,f=n=>Shaynly.fmt(n,v('cu')),gr=+v('gr')||0,inc=it.filter(x=>!x.o||x.on),sub=inc.reduce((a,x)=>a+x.r,0),tax=sub*gr/100,tot=sub+tax,
 ex=new Date(new Date(v('dt')).getTime()+(+v('vd')||0)*864e5).toISOString().slice(0,10),ms=v('ms').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(x=>x[0]);
 $('inv').innerHTML=`<div style="border-bottom:3px solid ${B.color||'#1f6f6b'};padding-bottom:10px;display:flex;justify-content:space-between">${B.logo?`<img src="${B.logo}" alt="" style="max-height:48px">`:''}<div><b style="font-size:18px">${esc(B.name||'Your business')}</b><br>${esc([B.email,B.phone].filter(Boolean).join(' | '))}</div><div style="text-align:right"><b>PROPOSAL</b><br>${esc(v('no'))}<br>${v('dt')}<br>Valid until ${ex}</div></div><h2 style="margin:14px 0 2px">${esc(v('pt'))}</h2><p class="muted">Prepared for ${esc(v('cn')||'client')}</p><p style="margin:10px 0;white-space:pre-wrap">${esc(v('sc'))}</p><table>${it.map((x,i)=>`<tr><td>${x.o?`<input type="checkbox" class="noprint" style="width:auto" data-o="${i}" ${x.on?'checked':''}> `:''}${esc(x.d)}${x.o?' <i>(optional)</i>':''}</td><td class="n" style="${x.o&&!x.on?'opacity:.45':''}">${f(x.r)}</td></tr>`).join('')}</table><table style="width:55%;margin-left:auto;margin-top:8px"><tr><td>Subtotal</td><td class="n">${f(sub)}</td></tr>${gr?`<tr><td>GST ${gr}%</td><td class="n">${f(tax)}</td></tr>`:''}<tr><th>Total</th><th class="n">${f(tot)}</th></tr></table><h3 style="margin:14px 0 4px">Payment schedule</h3><table>${ms.map(m=>`<tr><td>${esc(m[0])}</td><td class="n">${+m[1]||0}%</td><td class="n">${f(tot*(+m[1]||0)/100)}</td></tr>`).join('')}</table>${Math.round(ms.reduce((a,m)=>a+(+m[1]||0),0))!==100?'<p class="no noprint">Milestones add up to '+ms.reduce((a,m)=>a+(+m[1]||0),0)+'%, not 100%.</p>':''}<h3 style="margin:14px 0 4px">Terms</h3><p style="white-space:pre-wrap">${esc(v('tm'))}</p><p style="margin-top:22px">Accepted by: ______________________ &nbsp; Date: ____________</p>`}
$('it').oninput=e=>{const d=e.target.dataset;if(d.i===undefined)return;it[d.i][d.k]=d.k==='r'?+e.target.value||0:d.k==='o'?(e.target.checked?1:0):e.target.value;draw()};$('it').onchange=e=>{if(e.target.dataset.k==='o')draw()};
$('it').onclick=e=>{if(e.target.dataset.x!==undefined&&it.length>1){it.splice(+e.target.dataset.x,1);rows();draw()}};$('ai').onclick=()=>{it.push({d:'',r:0,o:0,on:1});rows();draw()};
$('inv').onchange=e=>{if(e.target.dataset.o!==undefined){it[e.target.dataset.o].on=e.target.checked?1:0;draw()}};
document.querySelector('.grid').addEventListener('input',draw);$('pr').onclick=()=>{D.n++;st.set(D);window.print()};rows();draw();
</script></body></html>
